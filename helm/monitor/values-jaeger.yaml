provisionDataStore:
  cassandra: false

storage:
  type: cassandra
  cassandra:
    host: cassandra.monitor.svc.cluster.local
    port: 9042
    user: cassandra
    existingSecret: cassandra-admin-auth


collector:
  enabled: true
  service:
    otlp:
      grpc:
        name: otlp-grpc
        port: 4317
      http:
        name: otlp-http
        port: 4318
query:
  enabled: true

agent:
  enabled: false

