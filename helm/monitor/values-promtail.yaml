config:
  lokiAddress: http://loki.monitor.svc.cluster.local:3100/loki/api/v1/push
  server:
    http_listen_port: 9080
    grpc_listen_port: 0
  positions:
    filename: /tmp/positions.yaml
  scrape_configs:
    - job_name: docker
      static_configs:
        - targets: [localhost]
          labels:
            job: docker-logs
            __path__: /var/log/containers/*.log
      pipeline_stages:
        - docker: {}
        - json:
            expressions:
              trace_id: trace_id
              level: level
              msg: msg
        - labels:
            trace_id: ""
            level: ""
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: dockerc
    hostPath:
      path: /var/lib/docker/containers
  - name: docksock
    hostPath:
      path: /var/run/docker.sock
extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: dockerc
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: docksock
    mountPath: /var/run/docker.sock
    readOnly: true
