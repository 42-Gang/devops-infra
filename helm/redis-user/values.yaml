auth:
  enabled: false

master:
  persistence:
    enabled: true
    size: 1Gi
    sizeLimit: 1Gi
    storageClass: local-path

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

replica:
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi
    sizeLimit: 1Gi
    storageClass: local-path

  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"