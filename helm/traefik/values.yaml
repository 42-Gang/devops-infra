# values.yaml

additionalArguments:
  - "--api.dashboard=true"
  - "--api.insecure=true"
  - "--providers.kubernetescrd"
  - "--accesslog=true"

service:
  type: NodePort
  nodePorts:
    web: 30080

ports:
  web:
    port: 8000
    protocol: TCP


providers:
  kubernetesCRD:
    enabled: true
    namespace:
      - msa
  kubernetesIngress:
    enabled: false

rbac:
  enabled: true

log:
  level: DEBUG

accessLog:
  enabled: true

resources:
  requests:
    cpu:    "100m"   # 최소 보장 0.1 CPU
    memory: "128Mi"  # 최소 보장 128MiB
  limits:
    cpu:    "500m"   # 최대 0.5 CPU
    memory: "512Mi"  # 최대 512MiB