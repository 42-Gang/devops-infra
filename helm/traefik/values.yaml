additionalArguments:
  - "--entryPoints.web.address=:80"
  - "--entryPoints.websecure.address=:443"
  - "--api.dashboard=true"
  - "--api.insecure=true"
  - "--providers.kubernetescrd"
  - "--accesslog=true"
  - "--accesslog.format=json"
  - "--accesslog.fields.defaultmode=keep"
  - "--accesslog.fields.headers.defaultmode=keep"
  - "--accesslog.fields.headers.names.traceparent=keep"
  - "--accesslog.fields.headers.names.baggage=keep"


service:
  type: LoadBalancer

hostNetwork: false

ports:
  web:
    port: 80
    protocol: TCP
  websecure:
    port: 443
    protocol: TCP

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE

providers:
  kubernetesCRD:
    enabled: true
    namespace:
      - msa
  kubernetesIngress:
    enabled: false

rbac:
  enabled: true

log:
  level: DEBUG

accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
      names:
        traceparent: keep
        baggage: keep


resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"

tracing:
  serviceName: "traefik"
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: "http://jaeger-collector.monitor.svc.cluster.local:4318/v1/traces"
      header: { }
