additionalArguments:
  - "--entryPoints.web.address=:80"   # ← Traefik이 직접 80포트를 열게 함
  - "--entryPoints.websecure.address=:443"
  - "--api.dashboard=true"
  - "--api.insecure=true"
  - "--providers.kubernetescrd"
  - "--accesslog=true"

service:
  type: LoadBalancer
hostNetwork: false

ports:
  web:
    port: 80
    protocol: TCP
  websecure:
    port: 443
    protocol: TCP

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE

providers:
  kubernetesCRD:
    enabled: true
    namespace:
      - msa
  kubernetesIngress:
    enabled: false

rbac:
  enabled: true

log:
  level: DEBUG

accessLog:
  enabled: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "300m"
    memory: "512Mi"

tracing:
  serviceName: "traefik"
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: "http://jaeger-collector.monitor.svc.cluster.local:4318/v1/traces"
      header: { }
