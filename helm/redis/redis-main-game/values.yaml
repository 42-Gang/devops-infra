auth:
  enabled: false

master:
  persistence:
    enabled: true
    size: 1Gi
    sizeLimit: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "100m"
      memory: "512Mi"

replica:
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi
    sizeLimit: 1Gi
    storageClass: local-path
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "100m"
      memory: "512Mi"