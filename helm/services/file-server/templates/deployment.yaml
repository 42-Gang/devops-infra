apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: Exists
          effect: NoSchedule
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: upload-volume
              mountPath: /uploads
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: CHAT_DB_URL
            - name: FASTIFY_LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: FASTIFY_LOG_LEVEL
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: CHAT_REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: CHAT_REDIS_PORT
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: KAFKA_BROKER
            - name: USER_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: USER_SERVER_URL
            - name: AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: AUTH_SERVER_URL
            - name: BASE_DIR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: FILE_SERVER_BASE_DIR
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: FILE_SERVER_BASE_URL
            - name: FASTIFY_PORT
              value: "{{ .Values.service.port }}"
            - name: JAEGER_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.env.SECRET_NAME }}
                  key: JAEGER_ENDPOINT
      volumes:
        - name: upload-volume
          persistentVolumeClaim:
            claimName: file-server-pvc