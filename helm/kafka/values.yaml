clusterId: "kraft-cluster-id-01"

controller:
  replicaCount: 3
  quorumBootstrapServers: ""
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "300m"
      memory: "512Mi"

broker:
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi

listeners:
  client:
    protocol: PLAINTEXT
    port: 9092
  internal:
    protocol: PLAINTEXT
    port: 9094
  controller:
    protocol: PLAINTEXT
    port: 9093

advertisedListeners:
  client:
    name: CLIENT
    port: 9092
    address: kafka-broker-headless.msa.svc.cluster.local
  internal:
    name: INTERNAL
    port: 9094
    address: kafka-broker-headless.msa.svc.cluster.local
  controller:
    name: CONTROLLER
    address: kafka-controller-0.kafka-controller-headless.msa.svc.cluster.local
    port: 9093

interBrokerListenerName: internal
controllerListenerNames: controller

zookeeper:
  enabled: false

extraEnvVars:
  - name: ALLOW_PLAINTEXT_LISTENER
    value: "yes"


persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"