clusterId: "kraft-cluster-id-01"

controller:
  replicaCount: 1
  quorumVoters: "0@kafka-0.kafka-headless.msa.svc.cluster.local:9093"
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: Exists
      effect: NoSchedule

listeners:
  client:
    protocol: PLAINTEXT
    containerPort: 9092
    name: CLIENT
  interbroker:
    protocol: PLAINTEXT
    containerPort: 9094
    name: INTERNAL
  controller:
    protocol: PLAINTEXT
    containerPort: 9093
    name: CONTROLLER

advertisedListeners:
  client:
    name: CLIENT
    port: 9092
    address: kafka-0.kafka-headless.msa.svc.cluster.local
  internal:
    name: INTERNAL
    port: 9094
    address: kafka-0.kafka-headless.msa.svc.cluster.local

interBrokerListenerName: INTERNAL
controllerListenerNames: CONTROLLER

extraEnvVars:
  - name: ALLOW_PLAINTEXT_LISTENER
    value: "yes"