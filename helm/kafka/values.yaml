image:
  tag: 4.0.0-debian-12-r3

zookeeper:
  enabled: false

broker:
  replicaCount: 0

controller:
  replicaCount: 1
  controllerOnly: false
  minId: 0

  overrideConfiguration:
    process.roles: "broker,controller"
    listener.security.protocol.map: "CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
    inter.broker.listener.name: "INTERNAL"
    controller.listener.names: "CONTROLLER"
    log.dirs: "/bitnami/kafka/data"
    #    controller.quorum.voters: "0@kafka-controller-0.kafka-controller-headless.msa.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-headless.msa.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-headless.msa.svc.cluster.local:9093"
    controller.quorum.voters: "0@kafka-controller-0.kafka-controller-headless.msa.svc.cluster.local:9093"
    offsets.topic.replication.factor: 1

  persistence:
    enabled: true
    size: 3Gi
    storageClass: local-path
  persistentVolumeClaimRetentionPolicy:
    enabled: true
    whenDeleted: Retain
    whenScaled: Retain

  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      cpu: 300m
      memory: 2Gi

  podManagementPolicy: Parallel
  minReadySeconds: 0
