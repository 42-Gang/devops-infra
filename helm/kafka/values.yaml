kraft:
  enabled: true
  clusterId: "kraft-cluster-id-01"

controller:
  replicaCount: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "300m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

broker:
  replicaCount: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "300m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

listeners:
  client:
    protocol: PLAINTEXT
    containerPort: 9092
    name: CLIENT
  controller:
    protocol: PLAINTEXT
    containerPort: 9093
    name: CONTROLLER
  interbroker:
    protocol: PLAINTEXT
    containerPort: 9094
    name: INTERNAL

sasl:
  enabledMechanisms: PLAIN
  interBrokerMechanism: PLAIN
  controllerMechanism: PLAIN
  interbroker:
    user: inter
    password: interpass
  controller:
    user: ctrl
    password: ctrlpass
  client:
    users:
      - user1
    passwords: password1

extraEnvVars:
  - name: ALLOW_PLAINTEXT_LISTENER
    value: "yes"
