clusterId: "kraft-cluster-id-01"

controller:
  replicaCount: 1
  quorumVoters: "0@kafka-controller-0.kafka-controller-headless.msa.svc.cluster.local:9093"
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

broker:
  replicaCount: 1
  controllerConnection:
    quorumVoters: "0@kafka-controller-0.kafka-controller-headless.msa.svc.cluster.local:9093"
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "300m"
      memory: "1Gi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

extraEnvVars:
  - name: ALLOW_PLAINTEXT_LISTENER
    value: "yes"
  - name: KAFKA_HEAP_OPTS
    value: "-Xmx512m -Xms512m" # 또는 broker 메모리를 1Gi 이상으로 할 것

listeners:
  client:
    protocol: PLAINTEXT
    containerPort: 9092
    name: CLIENT
  interbroker:
    protocol: PLAINTEXT
    containerPort: 9094
    name: INTERNAL
  controller:
    protocol: PLAINTEXT
    containerPort: 9093
    name: CONTROLLER
