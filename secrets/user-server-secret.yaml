apiVersion: v1
kind: Secret
metadata:
  name: user-server-secret
  namespace: msa
type: Opaque
stringData:
  DB_URL: "mysql://user:userpassword@mariadb-user.msa.svc.cluster.local:3306/database"
  JWT_SECRET: "your_jwt_secret"
  JWT_EXPIRES_IN: "5m"
  JWT_REFRESH_EXPIRES_IN: "3d"
  REDIS_HOST: "redis-user-master.msa.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BROKER: "kafka.msa.svc.cluster.local:9092"
